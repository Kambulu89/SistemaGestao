      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          { description: Automações por código; `issues` lista o que o servidor verifica agora. }
    post:
      summary: Cria uma automação em rascunho (automation.manage)
      description: |
        Exactamente um gatilho: `eventType` (do catálogo) ou `schedule` (calendário de cinco campos no `timezone`, intervalo
        mínimo de 5 minutos). `condition` é uma condição das políticas de acesso sobre os campos do evento
        (`resource.<campo>`); `actions` são acções do catálogo com parâmetros literais ou `{ "from": "payload.<campo>" }`.
        Nunca se executa código do tenant. A verificação contra o catálogo faz-se ao activar.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, actions]
              properties:
                code: { type: string }
                name: { type: string }
                description: { type: string, nullable: true }
                eventType: { type: string, nullable: true }
                schedule: { type: string, nullable: true }
                timezone: { type: string }
                condition: { type: object, additionalProperties: true, nullable: true }
                actions: { type: array, items: { type: object, additionalProperties: true } }
                maxRunsPerPeriod: { type: integer }
      responses:
        '201': { description: Automação em rascunho. }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /automations/{id}:
    get:
      summary: Uma automação (automation.read)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Automação e `issues`. }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      summary: Altera um rascunho ou uma automação pausada (automation.manage)
      description: Cada alteração é uma nova versão (as execuções ficam ligadas à versão que as originou). Uma automação activa não se altera (`AUTOMATION_ACTIVE`).
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer }
                name: { type: string }
                description: { type: string, nullable: true }
                eventType: { type: string, nullable: true }
                schedule: { type: string, nullable: true }
                timezone: { type: string }
                condition: { type: object, additionalProperties: true, nullable: true }
                actions: { type: array, items: { type: object, additionalProperties: true } }
                maxRunsPerPeriod: { type: integer }
      responses:
        '200': { description: Automação actualizada. }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /automations/{id}/activate:
    post:
      summary: Activa a automação em nome de quem a activa (automation.manage)
      description: |
        Verifica o gatilho, a condição e as acções contra o catálogo (422 com o caminho). A automação passa a executar com as
        permissões **actuais** do membro que a activou (nunca as da plataforma); só reage a eventos posteriores à activação.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer }
      responses:
        '200': { description: Automação activa (`nextRunAt` nos calendários). }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /automations/{id}/pause:
    post:
      summary: Pausa a automação (automation.manage)
      description: Bloqueia novas execuções; as pendentes fecham com `AUTOMATION_NOT_ACTIVE`. O histórico mantém-se.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer }
      responses:
        '200': { description: Automação pausada. }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /automations/{id}/simulate:
    post:
      summary: Simula a automação com um evento de exemplo, sem executar nada (automation.read)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                payload: { type: object, additionalProperties: true }
                scheduledFor: { type: string, format: date-time }
      responses:
        '200':
          {
            description: '`conditionPassed`, as acções com os parâmetros resolvidos (ou o erro) e, nos calendários, as próximas cinco execuções.',
          }
        '404': { $ref: '#/components/responses/Error' }
  /automation-runs:
    get:
      summary: Histórico de execuções (automation.read)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: automationId, in: query, required: false, schema: { type: string, format: uuid } }
        - {
            name: status,
            in: query,
            required: false,
            schema: { type: string, enum: [PENDING, RUNNING, SUCCEEDED, FAILED, DEAD] },
          }
      responses:
        '200': { description: Execuções (mais recentes primeiro, até 200). }
  /automation-runs/{id}:
    get:
      summary: Uma execução (automation.read)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Execução com tentativas, progresso, causalidade e erro. }
        '404': { $ref: '#/components/responses/Error' }
  /automation-runs/{id}/retry:
    post:
      summary: Reprocessa uma execução da fila de falhas (automation.manage)
      description: |
        Só `DEAD`/`FAILED`. Retoma a seguir à última acção concluída (mesma chave: não repete o que já foi feito) e regista quem
        reprocessou (e a auditoria). As execuções fechadas por regras do motor (`CAUSALITY_DEPTH`, `CAUSALITY_LOOP`,
        `PERIOD_LIMIT`, `CONDITION_ERROR`) respondem 409 `RUN_BLOCKED_BY_RULE`.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer }
      responses:
        '200': { description: Execução de novo na fila. }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /dynamic/{entityCode}/workflows:
    get:
      summary: Workflows publicados a que se pode submeter um registo da entidade (workflow.submit)
      description: Só o código, o nome, a revisão e as etapas (rótulos); os responsáveis e as condições não se revelam a quem submete.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: entityCode, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Workflows publicados. }
        '404': { $ref: '#/components/responses/Error' }
  /dynamic/{entityCode}/records/{id}/workflow-instances:
    get:
      summary: Processos de aprovação de um registo (dynamic.read)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: entityCode, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Processos do registo, mais recente primeiro. }
        '404': { $ref: '#/components/responses/Error' }
  /approval-tasks:
    get:
      summary: Minha caixa de aprovações (approval.decide)
      description: |
        `view=pending` (por omissão) lista o que está por decidir, incluindo o que posso tratar por delegação em vigor;
        `view=decided`, o que já tratei. Cada item traz o montante, a moeda, o solicitante, a etapa, o prazo (`overdue` quando
        vencido — nunca aprova por si), a versão do recurso e o que o utilizador pode fazer agora (`can`).
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - {
            name: view,
            in: query,
            required: false,
            schema: { type: string, enum: [pending, decided] },
          }
      responses:
        '200': { description: Tarefas. }
  /approval-tasks/{id}:
    get:
      summary: Uma tarefa (approval.decide)
      description: Quem não é responsável (nem por delegação) nem interveio na tarefa recebe 404.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Tarefa. }
        '404': { $ref: '#/components/responses/Error' }
  /approval-tasks/{id}/claim:
    post:
      summary: Reclama atomicamente uma tarefa de grupo (approval.decide)
      description: Só um dos candidatos a obtém (409 `TASK_NOT_OPEN` aos outros). Repetir a reclamação é inofensivo.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Tarefa reclamada. }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /approval-tasks/{id}/approve:
    post:
      summary: Aprova a tarefa (approval.decide)
      description: |
        Idempotente: repetir a mesma decisão devolve o resultado com `idempotent=true` e sem novos efeitos. Contradizê-la é 409
        `TASK_ALREADY_DECIDED`. Quem submeteu não decide (403 `TASK_NOT_ALLOWED`) e ninguém decide duas tarefas da mesma etapa.
        Uma delegação só vale dentro do período, do âmbito e do montante máximo. Ao concluir o processo sai
        `workflow.instance.approved` por outbox, na mesma transacção; o workflow nunca escreve no recurso.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, nullable: true, maxLength: 2000 }
      responses:
        '200': { description: Tarefa decidida. }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /approval-tasks/{id}/reject:
    post:
      summary: Rejeita a tarefa (approval.decide)
      description: O motivo é obrigatório. Um ALL rejeita o processo; ANY e QUORUM só quando já não é possível aprovar.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, nullable: true, maxLength: 2000 }
      responses:
        '200': { description: Tarefa decidida. }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /approval-tasks/{id}/return:
    post:
      summary: Devolve o pedido a quem o submeteu (approval.decide)
      description: O motivo é obrigatório. O processo termina (`RETURNED`) e as outras tarefas ficam canceladas.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, nullable: true, maxLength: 2000 }
      responses:
        '200': { description: Tarefa devolvida. }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /approval-delegations:
    get:
      summary: Delegações que dei e recebi (approval.delegate)
      description: Cada item traz `direction`, `GIVEN` (dada por mim) ou `RECEIVED`.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200': { description: Delegações (mais recentes primeiro). }
    post:
      summary: Delega as minhas aprovações noutro membro (approval.delegate)
      description: |
        Quem delega é sempre o próprio utilizador. Duração máxima de um ano, destinatário activo, `scope.workflowCodes?` e um
        `maxAmount` opcional (decimal em texto) com `currency`. Não há cadeias: o delegado age em nome de quem lhe delegou.
        Uma delegação que fecharia um ciclo é 409 `DELEGATION_CYCLE`.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toMembershipId, validUntil, reason]
              properties:
                toMembershipId: { type: string, format: uuid }
                validFrom: { type: string, format: date-time }
                validUntil: { type: string, format: date-time }
                scope: { type: object, additionalProperties: true }
                maxAmount: { type: string, nullable: true }
                currency: { type: string, nullable: true }
                reason: { type: string }
      responses:
        '201': { description: Delegação. }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /approval-delegations/{id}/revoke:
    post:
      summary: Revoga uma delegação (só quem a deu) (approval.delegate)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer }
      responses:
        '200': { description: Delegação revogada. }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /dynamic/{entityCode}/records/{id}/available-actions:
    get:
      summary: Transições que o utilizador pode executar agora neste registo (dynamic.read)
      description: |
        Só devolve as que a máquina em vigor define a partir do estado actual **e** que o utilizador pode executar
        (`dynamic.transition` com os atributos do registo, a permissão da transição e a guarda sobre os dados actuais).
        `state.version` é a `expectedVersion` das transições. Um registo anterior à máquina responde 409 `RECORD_WITHOUT_STATE`.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: entityCode, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Estado actual e acções. }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /dynamic/{entityCode}/records/{id}/state-history:
    get:
      summary: Histórico de estados do registo (dynamic.read)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: entityCode, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Entradas por ordem (a primeira é o estado inicial). }
        '404': { $ref: '#/components/responses/Error' }
  /dynamic/{entityCode}/records/{id}/transitions/{code}:
    post:
      summary: Executa uma transição de estado (dynamic.transition)
      description: |
        Bloqueia o estado do registo e verifica `expectedVersion`; o estado, o histórico e o evento de outbox escrevem-se na mesma
        transacção. Transição inexistente a partir do estado actual: 409 `TRANSITION_NOT_AVAILABLE`; guarda falsa: 409
        `TRANSITION_GUARD_FAILED`; motivo em falta: 422 `REASON_REQUIRED`. O estado nunca se altera por `PATCH` do registo.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: entityCode, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer }
                reason: { type: string, nullable: true }
      responses:
        '200': { description: 'Transição executada (`fromState`, `toState`, nova `version`).' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
