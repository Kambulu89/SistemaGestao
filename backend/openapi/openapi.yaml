  /purchase-orders/{id}/confirm:
    post:
      summary: Confirma a encomenda a fornecedor (purchase.confirm)
      description: |
        Atribui o número (sequência PURCHASE_ORDER) e escreve `procurement.purchase_order.confirmed`. Confirmar não recebe: a entrada de stock é uma recepção. Idempotente.
