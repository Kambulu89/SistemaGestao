        '409': { $ref: '#/components/responses/Error' }
  /purchase-orders/{id}/cancel:
    post:
      summary: Cancela uma encomenda confirmada, com motivo (purchase.confirm)
      description: |
        Só enquanto nenhuma recepção lançada a tocou (409 `PURCHASE_ORDER_HAS_RECEIPTS`). Idempotente.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
