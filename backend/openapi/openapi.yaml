  /goods-receipts:
    get:
      summary: Recepções de mercadoria (receipt.read; funcionalidade procurement.receipts)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - {
            name: purchaseOrderId,
            in: query,
            required: false,
            schema: { type: string, format: uuid },
          }
        - {
            name: status,
            in: query,
            required: false,
            schema: { type: string, enum: [DRAFT, POSTED, REVERSED] },
          }
        - {
            name: limit,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 200 },
          }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0 } }
      responses:
        '200': { description: 'Recepções; `meta.total` conta as que correspondem aos filtros.' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      summary: Cria uma recepção em rascunho de uma encomenda confirmada (receipt.manage)
      description: |
        Cada linha aponta para uma linha da encomenda e leva uma quantidade que cabe no saldo por receber (422 `EXCEEDS_BALANCE`). O armazém é obrigatório para lançar produtos com controlo de stock; produtos por lote exigem `lotCode`. Uma encomenda não confirmada ou toda recebida: 409 `PURCHASE_ORDER_NOT_RECEIVABLE`.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purchaseOrderId]
              properties:
                purchaseOrderId: { type: string, format: uuid }
                warehouseId: { type: string, format: uuid, nullable: true }
                supplierDocument: { type: string, maxLength: 100, nullable: true }
                notes: { type: string, nullable: true }
                lines:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [purchaseLineId, quantity]
                    properties:
                      purchaseLineId: { type: string, format: uuid }
                      quantity: { type: string }
                      lotCode: { type: string, nullable: true }
                      expiresOn: { type: string, format: date, nullable: true }
      responses:
        '201': { description: 'Recepção com as linhas.' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
