  /sales-orders/{id}/confirm:
    post:
      summary: Confirma a encomenda (sales.confirm)
      description: |
        Valida que há linhas e que o cliente pode receber vendas (409 `CUSTOMER_BLOCKED`/`CUSTOMER_INACTIVE`), corre as
        verificações registadas pelos módulos (stock, crédito: 409 `ORDER_NOT_CONFIRMABLE` com os motivos) e emite o número
        (sequência SALES_ORDER). **Não expede nem factura** (as expedições são `/shipments`): escreve o evento `sales.order.confirmed`. Se a organização tem
        um armazém de vendas (inventário), **reserva o stock na mesma transacção** (409 `ORDER_NOT_CONFIRMABLE` com
        `INSUFFICIENT_STOCK` se faltar e o armazém não aceitar encomendas em falta; nada fica gravado nem o número é gasto).
        Idempotente: confirmar outra vez devolve a encomenda com `idempotent: true`, sem novo número nem novo evento.
        `expectedVersion` é opcional.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expectedVersion: { type: integer }
      responses:
        '200': { description: '`order` e `idempotent`.' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
