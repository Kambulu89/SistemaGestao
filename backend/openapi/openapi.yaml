    post:
      summary: Cria uma tabela de preços (price.manage)
      description: |
        Uma tabela pertence a uma organização e a uma moeda (imutáveis depois de criada), vale de `validFrom` a `validTo`
        (datas ISO) e tem uma `priority` (-1000 a 1000; a mais alta vence, empate é ambíguo).
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
