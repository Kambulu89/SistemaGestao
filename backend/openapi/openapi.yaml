  /customers:
    get:
      summary: Clientes, com o nome, tipo e NIF da Party (customer.read; funcionalidade customers.accounts)
      description: |
        Pesquisa por nome da Party, código do cliente ou NIF e filtros por segmento, gestor de conta, organização, Party e
        estado. `creditLimit` só vem preenchido a quem tem `customer.credit_manage` (caso contrário é `null`).
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: segmentId, in: query, required: false, schema: { type: string, format: uuid } }
        - {
            name: accountManagerMembershipId,
            in: query,
            required: false,
            schema: { type: string, format: uuid },
          }
        - {
            name: organizationId,
            in: query,
            required: false,
            schema: { type: string, format: uuid },
          }
        - { name: partyId, in: query, required: false, schema: { type: string, format: uuid } }
        - {
            name: status,
            in: query,
            required: false,
            schema: { type: string, enum: [ACTIVE, BLOCKED, INACTIVE] },
          }
        - {
            name: limit,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 200 },
          }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0 } }
      responses:
        '200': { description: 'Clientes; `meta.total` conta os que correspondem aos filtros.' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      summary: Regista um cliente sobre uma Party existente (customer.create)
      description: |
        A Party não se duplica: o cliente guarda só as condições comerciais por organização (409 `CUSTOMER_EXISTS` se a mesma
        Party já for cliente dessa organização; 409 `CUSTOMER_CODE_TAKEN`). A moeda por omissão é a base da organização.
        Indicar `creditLimit` ou `currency` exige `customer.credit_manage` (403 sem ela). Dinheiro como texto com até 4 casas.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partyId, organizationId, code]
              properties:
                partyId: { type: string, format: uuid }
                organizationId: { type: string, format: uuid }
                code: { type: string }
                segmentId: { type: string, format: uuid, nullable: true }
                accountManagerMembershipId: { type: string, format: uuid, nullable: true }
                paymentTermDays: { type: integer, minimum: 0, maximum: 3650 }
                creditLimit: { type: string }
                currency: { type: string }
                status: { type: string, enum: [ACTIVE, INACTIVE] }
      responses:
        '201': { description: Cliente criado. }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
