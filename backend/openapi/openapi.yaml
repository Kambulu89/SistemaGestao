  /shipments/{id}/post:
    post:
      summary: Lança a expedição (shipment.post)
      description: |
        Confere o saldo de cada linha sob bloqueio da encomenda (409 `SHIPMENT_NOT_POSTABLE`), emite o número (sequência
        SHIPMENT), **baixa o stock na mesma transacção** (consome primeiro as reservas da linha e depois o stock livre do
        armazém de vendas; sem stock, 409 `SHIPMENT_NOT_POSTABLE` com `INSUFFICIENT_STOCK` e nada fica gravado) e passa a
        encomenda a `PARTIAL` ou `FULFILLED`. Idempotente: lançar outra vez devolve-a com `idempotent: true`.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: '`shipment` e `idempotent`.' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
