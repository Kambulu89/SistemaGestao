openapi: 3.0.3
info:
  title: Sistema de Gestão — API
  version: 0.2.0
  description: |
    Contrato da API `/api/v1` mantido à mão e verificado contra as rotas registadas
    (`tests/functional/openapi_parity.spec.ts`). Autenticação por cookie de sessão opaco
    (HttpOnly, SameSite=Lax) + cabeçalho `X-Csrf-Token` nas escritas autenticadas.
servers:
  - url: /api/v1
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sg_session
  headers:
    CorrelationId:
      description: Identificador do pedido (também no corpo).
      schema: { type: string }
  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      description: Selector do tenant (ou X-Tenant-Code); validado contra a membership activa.
      schema: { type: string, format: uuid }
    CsrfToken:
      name: X-Csrf-Token
      in: header
      required: true
      description: Token anti-CSRF obtido no login ou em `GET /me`.
      schema: { type: string }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details, correlationId]
          properties:
            code: { type: string }
            message: { type: string }
            correlationId: { type: string }
            details:
              type: array
              items:
                type: object
                required: [path, code, message]
                properties:
                  path: { type: string }
                  code: { type: string }
                  message: { type: string }
    User:
      type: object
      required: [id, email, displayName, locale]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: string }
        locale: { type: string, nullable: true }
    FieldInput:
      type: object
      required: [code, label, type]
      properties:
        code: { type: string, description: 'a-z, 0-9 e _; imutável depois de publicado.' }
        label: { type: string }
        type:
          type: string
          enum:
            [
              TEXT,
              TEXTAREA,
              NUMBER,
              DECIMAL,
              BOOLEAN,
              DATE,
              DATETIME,
              EMAIL,
              PHONE,
              URL,
              SELECT,
              RADIO,
              MULTISELECT,
              ENTITY_REFERENCE,
              USER_REFERENCE,
              FORMULA,
              LOOKUP,
            ]
        required: { type: boolean }
        defaultValue: { nullable: true }
        validation:
          type: object
          additionalProperties: true
          description: 'minLength, maxLength, pattern, min, max, precision, scale, minSelected, maxSelected, unique (conforme o tipo). FORMULA: expression (texto; + - * / round min max abs e códigos de campos numéricos) e scale (0 a 10); a árvore e as dependências são calculadas pelo servidor. LOOKUP (valor relacionado, lido em tempo real do registo de origem; só de leitura): relationField (campo ENTITY_REFERENCE desta entidade), sourceField (campo escalar da entidade de destino) e onMissing (empty ou error); o servidor acrescenta sourceType e scale. O valor só aparece a quem pode ler o registo de origem.'
        options:
          type: array
          items:
            type: object
            required: [code, label]
            properties:
              code: { type: string }
              label: { type: string }
        referenceEntityCode:
          { type: string, description: 'Entidade de destino (ENTITY_REFERENCE).' }
        sensitive: { type: boolean }
        readOnly: { type: boolean }
        presentation: { $ref: '#/components/schemas/FieldPresentation' }
    FieldPresentation:
      type: object
      description: 'Apresentação do campo. searchable/filterable/sortable só nos tipos que a listagem suporta e nunca em campos sensíveis.'
      properties:
        description: { type: string, maxLength: 500 }
        placeholder: { type: string, maxLength: 160 }
        searchable: { type: boolean }
        filterable: { type: boolean }
        sortable: { type: boolean }
    EntityPresentation:
      type: object
      properties:
        pluralName: { type: string, maxLength: 160 }
        icon: { type: string, pattern: '^[a-z][a-z0-9-]{0,39}$' }
  responses:
    Error:
      description: Erro no formato comum.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
paths:
  /health:
    get:
      summary: Liveness
      responses:
        '200': { description: O processo responde. }
  /ready:
    get:
      summary: Readiness (base de dados e Redis)
      responses:
        '200': { description: Pronto. }
        '503': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      summary: Inicia sessão (define o cookie de sessão)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200': { description: Sessão criada; devolve o utilizador e o token CSRF. }
        '401': { description: INVALID_CREDENTIALS (indistinguível entre causas). }
        '403': { description: ORIGIN_NOT_ALLOWED. }
        '422': { $ref: '#/components/responses/Error' }
        '429': { description: RATE_LIMITED, com `Retry-After`. }
  /auth/forgot-password:
    post:
      summary: Pede a recuperação de palavra-passe (resposta sempre igual)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        '202': { description: Aceite, exista ou não a conta. }
        '422': { $ref: '#/components/responses/Error' }
        '429': { description: RATE_LIMITED. }
  /auth/reset-password:
    post:
      summary: Conclui a recuperação com o token de uso único
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string }
      responses:
        '204': { description: Palavra-passe alterada; todas as sessões revogadas. }
        '400': { description: INVALID_OR_EXPIRED_TOKEN. }
        '422': { $ref: '#/components/responses/Error' }
  /auth/verify-email:
    post:
      summary: Verifica o email com o token de uso único
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '204': { description: Email verificado. }
        '400': { description: INVALID_OR_EXPIRED_TOKEN. }
  /auth/logout:
    post:
      summary: Termina a sessão actual
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '204': { description: Sessão revogada. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { description: CSRF_TOKEN_INVALID. }
  /me:
    get:
      summary: Utilizador autenticado
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Utilizador, token CSRF e sessão. }
        '401': { $ref: '#/components/responses/Error' }
  /me/sessions:
    get:
      summary: Sessões activas do utilizador
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Lista de sessões (a actual marcada). }
        '401': { $ref: '#/components/responses/Error' }
  /me/sessions/{id}:
    delete:
      summary: Revoga uma sessão própria
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Revogada. }
        '404': { description: Inexistente ou de outro utilizador. }
  /me/tenants:
    get:
      summary: Tenants a que o utilizador pertence (membership activa)
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Lista com id, código, nome e estado do tenant. }
        '401': { $ref: '#/components/responses/Error' }
  /me/security-events:
    get:
      summary: Actividade de segurança da própria conta (login, palavra-passe…)
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, maximum: 100 } }
      responses:
        '200':
          { description: Eventos do utilizador autenticado (sem metadados internos de outros). }
        '401': { $ref: '#/components/responses/Error' }
  /modules:
    get:
      summary: Catálogo de módulos do tenant (module.read)
      description: |
        Para cada módulo: dependências (`requires`), se o plano o licencia, o estado no tenant, os módulos
        obrigatórios ainda por activar (`missingDependencies`), os módulos activos que dependem dele
        (`activeDependents`) e as funcionalidades com o motivo quando não estão disponíveis.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200': { description: Módulos do registo com o estado do tenant. }
        '403': { $ref: '#/components/responses/Error' }
  /tenant/modules/{code}/enable:
    post:
      summary: Activa um módulo (module.manage)
      description: |
        Acesso efectivo = licença válida AND módulo activo AND funcionalidade ligada. `409 MODULE_NOT_LICENSED`,
        `409 DEPENDENCIES_MISSING` (módulos a activar antes, em `details`) ou, com `withDependencies`, activa-os
        pela ordem certa. Repetir é seguro; uma falha deixa o módulo em `ERROR` e pode ser retomada.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                withDependencies: { type: boolean }
      responses:
        '200': { description: Módulo com o estado actual. }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /tenant/modules/{code}/disable:
    post:
      summary: Desactiva um módulo (module.manage)
      description: |
        Bloqueia novos comandos; não apaga tabelas, dados nem histórico. `409 DEPENDENTS_ENABLED` se houver
        módulos activos que dependam dele. A resposta traz `affectedFeatures`.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: 'module e affectedFeatures.' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /tenant/features/{code}:
    put:
      summary: Override de uma funcionalidade do tenant (module.manage)
      description: |
        `override` true/false com `reason` obrigatório e `expiresAt` opcional (futuro); `null` repõe o valor por
        omissão. Um override a favor nunca ultrapassa a licença do plano (`409 FEATURE_NOT_LICENSED`).
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [override]
              properties:
                override: { type: boolean, nullable: true }
                reason: { type: string, maxLength: 500, nullable: true }
                expiresAt: { type: string, format: date-time, nullable: true }
      responses:
        '200': { description: Funcionalidade com o estado efectivo. }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /context/features:
    get:
      summary: Funcionalidades efectivas do tenant
      description: Só conveniência para a interface; cada comando volta a ser verificado no servidor (`403 FEATURE_NOT_AVAILABLE`).
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200': { description: 'Lista de code, moduleCode, enabled e reason.' }
  /settings/effective:
    get:
      summary: Valores efectivos das configurações, com o nível de origem
      description: |
        Precedência (menor → maior): omissão < tenant < organização < filial < módulo < filial+módulo < membership,
        restringida aos âmbitos que cada chave admite (as regras fiscais só admitem tenant e organização; nunca
        override pessoal). Não exige permissão extra. `source.level` diz de onde veio o valor.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - {
            name: organizationId,
            in: query,
            required: false,
            schema: { type: string, format: uuid },
          }
        - { name: branchId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: moduleCode, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          {
            description: 'Uma entrada por chave: value, source (level, scopeId, moduleCode, version), category, description, spec (tipo e opções) e allowedScopes.',
          }
        '422': { $ref: '#/components/responses/Error' }
  /settings:
    get:
      summary: Valores guardados por âmbito (settings.read)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: key, in: query, required: false, schema: { type: string } }
        - { name: scopeType, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: 'Valores com key, scopeType, scopeId, moduleCode, value e version.' }
        '403': { $ref: '#/components/responses/Error' }
  /settings/{key}:
    put:
      summary: Define o valor de uma chave num âmbito (settings.manage)
      description: |
        Actualizar um valor existente exige `expectedVersion` (409 `VERSION_REQUIRED` / `VERSION_CONFLICT`).
        `422 SCOPE_NOT_ALLOWED` se a chave não admite o âmbito. A combinação filial+módulo é `BRANCH` com `moduleCode`.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scopeType, value]
              properties:
                scopeType: { type: string, enum: [TENANT, ORGANIZATION, BRANCH, MODULE] }
                scopeId: { type: string, format: uuid, nullable: true }
                moduleCode: { type: string, nullable: true }
                value: {}
                expectedVersion: { type: integer }
      responses:
        '200': { description: Valor guardado. }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      summary: Repõe a herança (remove o valor do âmbito) (settings.manage)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: key, in: path, required: true, schema: { type: string } }
        - { name: scopeType, in: query, required: true, schema: { type: string } }
        - { name: scopeId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: moduleCode, in: query, required: false, schema: { type: string } }
      responses:
        '204': { description: Removido. }
        '404': { $ref: '#/components/responses/Error' }
  /me/settings/{key}:
    put:
      summary: Preferência pessoal (âmbito MEMBERSHIP do próprio membro)
      description: Só chaves que admitem o âmbito MEMBERSHIP (as regras fiscais não admitem).
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: {}
                expectedVersion: { type: integer }
      responses:
        '200': { description: Valor guardado. }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      summary: Repõe a herança da preferência pessoal
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Removido. }
        '404': { $ref: '#/components/responses/Error' }
  /tax-rates:
    get:
      summary: Taxas de imposto (settings.read)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - {
            name: organizationId,
            in: query,
            required: false,
            schema: { type: string, format: uuid },
          }
        - { name: code, in: query, required: false, schema: { type: string } }
        - {
            name: on,
            in: query,
            required: false,
            schema: { type: string, format: date },
            description: Só as válidas nesta data.,
          }
      responses:
        '200': { description: 'Taxas com `rate` em string e intervalo de validade.' }
    post:
      summary: Cria uma taxa (settings.manage)
      description: |
        `409 TAX_RATE_OVERLAP` se o período se sobrepuser a outro do mesmo código e organização. Uma taxa zero exige
        `exemptionReason`. A taxa copia-se para as linhas emitidas; não se altera depois (feche o período e crie outra).
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId, code, name, rate, validFrom, category]
              properties:
                organizationId: { type: string, format: uuid }
                code: { type: string }
                name: { type: string }
                rate: { type: string }
                validFrom: { type: string, format: date }
                validTo: { type: string, format: date, nullable: true }
                category: { type: string }
                exemptionReason: { type: string, nullable: true }
      responses:
        '201': { description: Criada. }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /tax-rates/{id}:
    patch:
      summary: Altera nome, categoria, motivo ou fim de validade (settings.manage)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer }
                name: { type: string }
                validTo: { type: string, format: date, nullable: true }
                category: { type: string }
                exemptionReason: { type: string, nullable: true }
      responses:
        '200': { description: Taxa actualizada. }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /units:
    get:
      summary: Unidades de medida (settings.read)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200': { description: Unidades com dimensão, precisão, base e factor. }
    post:
      summary: Cria uma unidade (settings.manage)
      description: Uma unidade derivada indica a unidade base (da mesma dimensão, sem cadeias) e o factor.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, dimension, precision]
              properties:
                code: { type: string }
                name: { type: string }
                dimension: { type: string }
                precision: { type: integer, minimum: 0, maximum: 6 }
                baseUnitId: { type: string, format: uuid, nullable: true }
                conversionFactor: { type: string, nullable: true }
      responses:
        '201': { description: Criada. }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /units/convert:
    get:
      summary: Converte uma quantidade entre unidades da mesma dimensão (settings.read)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: from, in: query, required: true, schema: { type: string } }
        - { name: to, in: query, required: true, schema: { type: string } }
        - { name: quantity, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: 'Resultado em string, arredondado à precisão do destino.' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /units/{id}:
    patch:
      summary: Altera nome ou precisão (settings.manage)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer }
                name: { type: string }
                precision: { type: integer }
      responses:
        '200': { description: Unidade actualizada. }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /sequences:
    get:
      summary: Sequências de numeração (settings.read)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - {
            name: organizationId,
            in: query,
            required: false,
            schema: { type: string, format: uuid },
          }
        - { name: documentType, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: 'Sequências; `nextValue` em string.' }
    post:
      summary: Cria uma sequência (sequence.manage)
      description: |
        Uma por organização, filial (opcional), tipo de documento, série e período (`ALL`, `AAAA` ou `AAAA-MM`).
        Modelo com os tokens {YYYY} {YY} {MM} {SERIES} {ORG} {BRANCH}.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId, documentType, series, prefixTemplate]
              properties:
                organizationId: { type: string, format: uuid }
                branchId: { type: string, format: uuid, nullable: true }
                documentType: { type: string }
                series: { type: string }
                period: { type: string }
                prefixTemplate: { type: string }
                nextValue: { type: string }
                padding: { type: integer, minimum: 1, maximum: 12 }
      responses:
        '201': { description: Criada. }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /sequences/{id}:
    patch:
      summary: Altera modelo, preenchimento ou sobe o próximo número (sequence.manage)
      description: O próximo número nunca diminui (`422 NEXT_VALUE_DECREASE`).
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer }
                prefixTemplate: { type: string }
                padding: { type: integer }
                nextValue: { type: string }
      responses:
        '200': { description: Sequência actualizada. }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /sequences/preview:
    post:
      summary: Pré-visualiza o formato sem consumir número (sequence.manage)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId, series, prefixTemplate]
              properties:
                organizationId: { type: string, format: uuid }
                branchId: { type: string, format: uuid, nullable: true }
                series: { type: string }
                prefixTemplate: { type: string }
                padding: { type: integer }
                nextValue: { type: string }
                date: { type: string, format: date-time }
      responses:
        '200': { description: 'example: o número que seria emitido.' }
        '422': { $ref: '#/components/responses/Error' }
  /platform/me:
    get:
      summary: Permissões de plataforma da própria conta
      description: Só para a interface; vazio se a conta não tem nenhuma concessão `platform.*` em vigor. Não exige concessão.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: 'permissions: lista de códigos platform.* em vigor.' }
        '401': { $ref: '#/components/responses/Error' }
  /platform/tenants:
    get:
      summary: Tenants da plataforma, com estado e plano (platform.tenant.manage)
      description: |
        Rotas de plataforma **não** têm selector de tenant e usam política própria (`platform.*`, concessão explícita).
        Uma concessão de plataforma não dá acesso a dados empresariais de nenhum tenant.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: 'Lista com id, code, name, status e plan.' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      summary: Provisiona um tenant (platform.tenant.manage)
      description: |
        Cria o tenant em PROVISIONING, atribui o plano, garante o papel de administrador e a organização
        inicial, convida o administrador por email (nenhuma palavra-passe é pedida) e só então o activa.
        Cada passo é idempotente: repetir o pedido (ou retomar após falha) não duplica a organização nem o
        convite. `201` se criou o tenant, `200` se já existia.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, adminEmail, planCode]
              properties:
                code: { type: string }
                name: { type: string }
                adminEmail: { type: string }
                planCode: { type: string }
                planRevision: { type: integer }
                trialDays: { type: integer }
      responses:
        '200': { description: Tenant já existia; estado do provisionamento. }
        '201': { description: Tenant criado e provisionado. }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /platform/tenants/{id}:
    get:
      summary: Estado do provisionamento de um tenant (platform.tenant.manage)
      description: Passos concluídos e em falta, contagens de organizações e convites pendentes (sem dados de negócio).
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 'tenant, done, pending, organizations e pendingInvitations.' }
        '404': { $ref: '#/components/responses/Error' }
  /platform/tenants/{id}/suspend:
    post:
      summary: Suspende um tenant (platform.tenant.manage)
      description: Impede novas operações empresariais; o motivo fica nos eventos de segurança.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200': { description: Tenant suspenso. }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /platform/tenants/{id}/resume:
    post:
      summary: Reactiva um tenant suspenso (platform.tenant.manage)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200': { description: Tenant activo. }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /platform/plans:
    get:
      summary: Versões de planos (platform.billing.manage)
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: 'Versões com `price` em string, limites e direitos.' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      summary: Cria uma nova revisão (rascunho) de um plano (platform.billing.manage)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planCode, name, currency, price, billingInterval, limits]
              properties:
                planCode: { type: string }
                name: { type: string }
                currency: { type: string }
                price: { type: string }
                billingInterval: { type: string, enum: [MONTH, YEAR] }
                limits: { type: object }
                entitlements: { type: object }
      responses:
        '201': { description: Rascunho criado. }
        '422': { $ref: '#/components/responses/Error' }
  /platform/plans/{code}/revisions/{revision}/publish:
    post:
      summary: Publica uma revisão (fica imutável) (platform.billing.manage)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - { name: code, in: path, required: true, schema: { type: string } }
        - { name: revision, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Revisão publicada. }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /platform/plans/{code}/revisions/{revision}/retire:
    post:
      summary: Retira uma revisão publicada (platform.billing.manage)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - { name: code, in: path, required: true, schema: { type: string } }
        - { name: revision, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Revisão retirada. }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /platform/tenants/{id}/subscription:
    get:
      summary: Assinatura de um tenant, com consumo e histórico (platform.billing.manage)
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 'plan, subscription, entitled, usage e history.' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      summary: Atribui um plano publicado a um tenant (platform.billing.manage)
      description: Idempotente para o mesmo plano; outro plano exige a mudança de plano.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planCode]
              properties:
                planCode: { type: string }
                revision: { type: integer }
                trialDays: { type: integer }
      responses:
        '200': { description: Assinatura. }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /platform/tenants/{id}/subscription/plan:
    put:
      summary: Muda o plano de um tenant (platform.billing.manage)
      description: |
        Upgrade aplica-se logo. Se o consumo exceder os novos limites, `409 PLAN_LIMITS_EXCEEDED`, excepto com
        `adequacyDays`: nada é eliminado e o excesso só bloqueia novos consumos.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planCode]
              properties:
                planCode: { type: string }
                revision: { type: integer }
                adequacyDays: { type: integer }
      responses:
        '200': { description: Assinatura actualizada. }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /platform/tenants/{id}/subscription/status:
    put:
      summary: Muda o estado da assinatura (platform.billing.manage)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ACTIVE, PAST_DUE, SUSPENDED, CANCELLED] }
                graceDays: { type: integer }
      responses:
        '200': { description: Assinatura actualizada. }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /tenant/subscription:
    get:
      summary: Plano contratado, consumo, limites e bloqueios do tenant (subscription.read)
      description: |
        Mostra os preços e limites da **versão contratada** (uma versão publicada nunca muda); `price` é um decimal em
        string. Se o consumo exceder o limite de uma métrica (ex.: após um downgrade com período de adequação),
        `usage[].blocked` é verdadeiro e `subscription.adequacyUntil` indica o prazo; nada é eliminado.
        `404` se o tenant não tem assinatura.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          {
            description: 'plan (code, revision, name, price, currency, billingInterval, limits, entitlements), subscription (status, entitled, datas), usage por métrica e history.',
          }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /audit-logs:
    get:
      summary: Histórico de alterações do tenant (audit.read)
      description: |
        Só inclui recursos que o actor pode ler (RBAC) e omite, de antes/depois, os campos escondidos
        pelas regras de campo. Segredos e campos sensíveis são redigidos na origem (`[REDACTED]`).
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: resourceType, in: query, required: false, schema: { type: string } }
        - { name: resourceId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: action, in: query, required: false, schema: { type: string } }
        - {
            name: actorMembershipId,
            in: query,
            required: false,
            schema: { type: string, format: uuid },
          }
        - { name: limit, in: query, required: false, schema: { type: integer, maximum: 100 } }
        - { name: offset, in: query, required: false, schema: { type: integer } }
      responses:
        '200': { description: Entradas por ordem decrescente de data. }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /security-events:
    get:
      summary: Eventos de segurança do tenant (audit.read)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: limit, in: query, required: false, schema: { type: integer, maximum: 100 } }
        - { name: offset, in: query, required: false, schema: { type: integer } }
      responses:
        '200': { description: Eventos com tenant_id igual ao do contexto. }
        '403': { $ref: '#/components/responses/Error' }
  /context:
    get:
      summary: Contexto do tenant seleccionado
      description: |
        O tenant é indicado por `X-Tenant-Id` ou `X-Tenant-Code` (ou por um domínio verificado no `Host`).
        É apenas um selector: o servidor valida a membership activa e o estado do tenant.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: X-Tenant-Id, in: header, required: false, schema: { type: string, format: uuid } }
        - { name: X-Tenant-Code, in: header, required: false, schema: { type: string } }
      responses:
        '200':
          {
            description: Tenant,
            membership,
            utilizador,
            locale,
            authorizationVersion e âmbito de unidades.,
          }
        '400': { description: TENANT_SELECTOR_REQUIRED / INVALID / AMBIGUOUS / MISMATCH. }
        '401': { $ref: '#/components/responses/Error' }
        '403':
          {
            description: TENANT_ACCESS_DENIED (sem membership ou tenant inexistente) ou TENANT_NOT_ACTIVE.,
          }
  /me/password:
    post:
      summary: Altera a palavra-passe (exige a actual; revoga as outras sessões)
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string }
      responses:
        '204': { description: Alterada. }
        '403': { description: REAUTHENTICATION_FAILED. }
        '422': { $ref: '#/components/responses/Error' }
        '429': { description: RATE_LIMITED. }
  /permissions:
    get:
      summary: Catálogo de permissões (iam.read)
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      responses:
        '200': { description: Permissões `<recurso>.<acção>`. }
        '403': { description: PERMISSION_DENIED. }
  /roles:
    get:
      summary: Papéis do tenant (iam.read)
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      responses:
        '200': { description: Papéis com os códigos das suas permissões. }
        '403': { description: PERMISSION_DENIED. }
    post:
      summary: Cria um papel (iam.manage)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, permissionCodes]
              properties:
                code: { type: string }
                name: { type: string }
                description: { type: string, nullable: true }
                permissionCodes: { type: array, items: { type: string } }
      responses:
        '201': { description: Criado (cabeçalho Location). }
        '409': { description: ROLE_CODE_TAKEN. }
        '422': { $ref: '#/components/responses/Error' }
  /roles/{id}:
    get:
      summary: Detalhe de um papel (iam.read)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Papel. }
        '404': { description: Inexistente ou de outro tenant. }
    patch:
      summary: Altera um papel com expectedVersion (iam.manage)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer }
                name: { type: string }
                description: { type: string, nullable: true }
                permissionCodes: { type: array, items: { type: string } }
      responses:
        '200': { description: Actualizado; invalida a authorizationVersion de quem tem o papel. }
        '409': { description: VERSION_CONFLICT ou SYSTEM_ROLE_IMMUTABLE. }
        '404': { description: Inexistente ou de outro tenant. }
    delete:
      summary: Remove um papel (iam.manage)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Removido. }
        '409': { description: ROLE_IN_USE ou SYSTEM_ROLE_IMMUTABLE. }
  /role-assignments:
    get:
      summary: Atribuições de papéis (iam.read)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: membershipId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Atribuições. }
    post:
      summary: Atribui um papel a uma membership (iam.manage)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [membershipId, roleId]
              properties:
                membershipId: { type: string, format: uuid }
                roleId: { type: string, format: uuid }
                organizationUnitId: { type: string, format: uuid, nullable: true }
                validFrom: { type: string, format: date-time, nullable: true }
                validUntil: { type: string, format: date-time, nullable: true }
      responses:
        '201': { description: Criada. }
        '404': { description: Membership ou papel inexistentes neste tenant. }
        '409': { description: ASSIGNMENT_EXISTS. }
        '422': { $ref: '#/components/responses/Error' }
  /role-assignments/{id}:
    delete:
      summary: Revoga uma atribuição (iam.manage)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Revogada. }
        '404': { description: Inexistente ou de outro tenant. }
  /access-policies:
    get:
      summary: Políticas ABAC (iam.read)
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      responses:
        '200': { description: Políticas. }
    post:
      summary: Cria uma política (iam.manage)
      description: |
        `condition` é uma AST declarativa (and/or/not/eq/neq/gt/gte/lt/lte/in/exists) com variáveis
        `subject.*`, `resource.*` e `env.*`. Nunca se executa código do tenant. Qualquer DENY activo
        aplicável prevalece; havendo políticas ALLOW aplicáveis, pelo menos uma tem de se verificar.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, resource, action, effect]
              properties:
                name: { type: string }
                resource: { type: string, description: 'Ou * para qualquer.' }
                action: { type: string, description: 'Ou * para qualquer.' }
                effect: { type: string, enum: [ALLOW, DENY] }
                condition: { type: object, nullable: true }
                priority: { type: integer }
                status: { type: string, enum: [DRAFT, ACTIVE, DISABLED] }
                fieldRules:
                  type: array
                  items:
                    type: object
                    required: [field, mode]
                    properties:
                      field: { type: string }
                      mode: { type: string, enum: [HIDDEN, READ_ONLY] }
                      when: { type: object }
      responses:
        '201': { description: Criada (estado DRAFT por omissão). }
        '422': { description: AST ou regras inválidas, com o caminho do problema. }
  /access-policies/{id}:
    patch:
      summary: Altera uma política com expectedVersion (iam.manage)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer }
      responses:
        '200':
          { description: Actualizada; invalida a authorizationVersion de todas as memberships. }
        '404': { description: Inexistente ou de outro tenant. }
        '409': { description: VERSION_CONFLICT. }
  /authorization/simulate:
    post:
      summary: Simula uma decisão (iam.manage); não concede nem altera nada
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [membershipId, permission]
              properties:
                membershipId: { type: string, format: uuid }
                permission: { type: string }
                resource: { type: object }
      responses:
        '200': { description: Decisão, origem (papéis e políticas) e campos ocultos/só de leitura. }
        '404': { description: Membership inexistente neste tenant. }
  /organizations:
    get:
      summary: Organizações (organization.read)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200': { description: OK. }
    post:
      summary: Cria uma organização (organization.manage)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, legalName, countryCode, baseCurrency]
              properties:
                code: { type: string }
                legalName: { type: string }
                tradeName: { type: string, nullable: true }
                countryCode: { type: string, description: ISO 3166-1 alfa-2 }
