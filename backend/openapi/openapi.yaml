        `INSUFFICIENT_STOCK` (salvo `allowNegative`). `reference` torna o pedido repetível: a mesma referência devolve o
        movimento já lançado (200, `idempotent: true`); com outro conteúdo, 409 `SOURCE_CONFLICT`. Produtos sem controlo de
