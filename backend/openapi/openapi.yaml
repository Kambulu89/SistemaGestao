  /entity-definitions:
    get:
      summary: Entidades dinâmicas do tenant (entity.read)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          { description: 'Entidades com estado, revisão publicada em vigor e modo de propriedade.' }
    post:
      summary: Cria uma entidade com o primeiro rascunho (entity.design)
      description: |
        Os campos seguem a matriz de tipos (C10). Tipos ainda não disponíveis (CURRENCY, CHECKBOX, FILE, IMAGE,
        LOOKUP, AUTONUMBER) são recusados com `FIELD_TYPE_NOT_SUPPORTED`. Uma referência indica a entidade
        de destino por `referenceEntityCode`.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string }
                name: { type: string }
                description: { type: string, nullable: true }
                kind: { type: string, enum: [DYNAMIC] }
                ownershipMode: { type: string, enum: [TENANT, UNIT, OWNER] }
                presentation: { $ref: '#/components/schemas/EntityPresentation' }
                fields: { type: array, items: { $ref: '#/components/schemas/FieldInput' } }
      responses:
        '201': { description: 'Entidade, rascunho (revisão 1) e versões.' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /entity-definitions/{id}:
    get:
      summary: Detalhe da entidade, com rascunho e versão publicada (entity.read)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 'Entidade, rascunho, versão publicada e lista de versões.' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      summary: Altera nome, descrição ou (antes de publicar) o modo de propriedade (entity.design)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer }
                name: { type: string }
                description: { type: string, nullable: true }
                ownershipMode: { type: string, enum: [TENANT, UNIT, OWNER] }
                presentation: { $ref: '#/components/schemas/EntityPresentation' }
      responses:
        '200': { description: Entidade actualizada. }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      summary: Remove uma entidade que nunca foi publicada (entity.design)
      description: 'Uma entidade publicada não se remove (arquiva-se). Recusada se outra entidade a referencia (`ENTITY_IN_USE`).'
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Removida. }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /entity-definitions/{id}/draft:
    put:
      summary: Substitui os campos do rascunho (entity.design)
      description: A compatibilidade com a versão em vigor é verificada na pré-visualização e na publicação.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, fields]
              properties:
                expectedVersion: { type: integer }
                fields: { type: array, items: { $ref: '#/components/schemas/FieldInput' } }
      responses:
        '200': { description: Entidade com o rascunho actualizado. }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      summary: Descarta o rascunho de uma entidade já publicada (entity.design)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Entidade sem rascunho. }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /entity-definitions/{id}/drafts:
    post:
      summary: Abre uma nova revisão em rascunho a partir da versão publicada (entity.design)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201': { description: Entidade com o novo rascunho. }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /entity-definitions/{id}/publish-preview:
    get:
      summary: Alterações do rascunho e compatibilidade, sem publicar (entity.read)
      description: Devolve campos acrescentados, retirados e alterados, os problemas bloqueantes e quantos registos estão em versões anteriores.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Pré-visualização da publicação. }
        '404': { $ref: '#/components/responses/Error' }
  /entity-definitions/{id}/publish:
    post:
      summary: Publica o rascunho (versão imutável) (entity.publish)
      description: 'Alterações incompatíveis sem migração são recusadas com `INCOMPATIBLE_SCHEMA`; nada se apaga (campos e opções retirados ficam arquivados).'
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer }
      responses:
        '200': { description: Entidade publicada. }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /entity-definitions/{id}/archive:
    post:
      summary: Arquiva a entidade; os registos continuam legíveis (entity.publish)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer }
      responses:
        '200': { description: Entidade arquivada. }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /dynamic/{entityCode}/records:
    get:
      summary: Registos de uma entidade (dynamic.read)
      description: |
        Filtros por valor exacto: `filter.<campo>=valor` (até 10; só campos filtráveis e não sensíveis). Um campo escondido por
        regra de campo não ordena, filtra nem pesquisa. A resposta traz `meta.total`, `meta.limit` e `meta.offset`.
        `q` pesquisa nos campos de texto **não sensíveis** e pesquisáveis. Em entidades de modo OWNER só se vêem os registos próprios
        (salvo `dynamic.all`); em modo UNIT, os das unidades do âmbito do actor.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: entityCode, in: path, required: true, schema: { type: string } }
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: archived, in: query, required: false, schema: { type: boolean } }
        - {
            name: limit,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 100 },
          }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0 } }
      responses:
        '200': { description: 'Registos com a revisão do esquema com que foram validados.' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      summary: Cria um registo na versão publicada em vigor (dynamic.create)
      description: 'Campos sensíveis exigem `dynamic.sensitive`. Valores únicos concorrentes: só um passa (`UNIQUE_VALUE_TAKEN`).'
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: entityCode, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { type: object, additionalProperties: true }
                organizationUnitId: { type: string, format: uuid, nullable: true }
      responses:
        '201': { description: Registo criado. }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /dynamic/{entityCode}/records/{id}:
    get:
      summary: Um registo, com a versão do esquema em que foi gravado (dynamic.read)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: entityCode, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Registo. }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      summary: Altera valores (parcial; null apaga) e passa o registo à versão em vigor (dynamic.update)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: entityCode, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data, expectedVersion]
              properties:
                expectedVersion: { type: integer }
                data: { type: object, additionalProperties: true }
      responses:
        '200': { description: Registo actualizado. }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /dynamic/{entityCode}/records/{id}/archive:
    post:
      summary: Arquiva um registo (dynamic.archive)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: entityCode, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer }
      responses:
        '200': { description: Registo arquivado (os valores únicos ficam livres). }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /rules:
    get:
      summary: Regras de negócio, com todas as revisões (rule.read)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: entityCode, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: Regras (mais recente primeiro dentro de cada código). }
    post:
      summary: Cria uma regra em rascunho (revisão 1) (rule.manage)
      description: |
        `conditionAst` usa a gramática das políticas de acesso (and/or/not, eq/neq/gt/gte/lt/lte/in/exists) com
        variáveis `resource.<campo>` (campos activos e **não sensíveis** da entidade), `subject.membershipId|userId|organizationId`
        e `env.now`. `actionAst` é `{ type: BLOCK, message, field? }`: a escrita é bloqueada quando a condição se verifica.
        A entidade tem de estar publicada. Nunca se executa código do tenant.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entityCode, code, name, conditionAst, actionAst]
              properties:
                entityCode: { type: string }
                code: { type: string }
                name: { type: string }
                description: { type: string, nullable: true }
                priority: { type: integer, minimum: 0, maximum: 1000 }
                conditionAst: { type: object, additionalProperties: true }
                actionAst: { type: object, additionalProperties: true }
                effectiveFrom: { type: string, format: date-time, nullable: true }
                effectiveTo: { type: string, format: date-time, nullable: true }
      responses:
        '201': { description: Regra em rascunho. }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /rules/{id}:
    get:
      summary: Uma revisão de uma regra (rule.read)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Regra. }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      summary: Altera um rascunho (rule.manage)
      description: Uma regra publicada ou desactivada é imutável (`RULE_NOT_DRAFT`); abra uma nova revisão.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer }
                name: { type: string }
                description: { type: string, nullable: true }
                priority: { type: integer }
                conditionAst: { type: object, additionalProperties: true }
                actionAst: { type: object, additionalProperties: true }
                effectiveFrom: { type: string, format: date-time, nullable: true }
                effectiveTo: { type: string, format: date-time, nullable: true }
      responses:
        '200': { description: Rascunho actualizado. }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /rules/{id}/revisions:
    post:
      summary: Abre a próxima revisão em rascunho (rule.manage)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201': { description: Nova revisão em rascunho (cópia da mais recente). }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /rules/{id}/simulate:
    post:
      summary: Avalia a regra sobre valores de exemplo, sem gravar nada (rule.manage)
      description: Respeita o período de vigência (`SKIPPED` fora dele). Devolve `PASS`, `FAIL` (com a mensagem), `SKIPPED` ou `ERROR`.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values: { type: object, additionalProperties: true }
                now: { type: string, format: date-time }
      responses:
        '200': { description: Resultado da simulação. }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /rules/{id}/publish:
    post:
      summary: Publica o rascunho (revisão imutável) e desactiva a anterior (rule.manage)
      description: Volta a validar a regra contra os campos em vigor; uma regra inválida nunca se publica.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer }
      responses:
        '200': { description: Regra publicada. }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /rules/{id}/disable:
    post:
      summary: Desactiva uma regra publicada (rule.manage)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer }
      responses:
        '200': { description: Regra desactivada (nada se apaga). }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /rules/{id}/evaluations:
    get:
      summary: Últimas avaliações recusadas ou com erro (rule.read)
      description: Cada linha guarda o resumo (SHA-256) dos dados, nunca os valores.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
