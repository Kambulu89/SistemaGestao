  /purchase-requisitions/{id}/convert:
    post:
      summary: Converte uma requisição aprovada numa encomenda em rascunho (purchase.manage)
      description: |
        A requisição não leva preços: `lines` traz o custo (e a taxa) de **cada** variante da requisição (422 `COST_REQUIRED`). As quantidades vêm da requisição. Idempotente: converter outra vez devolve a encomenda.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supplierId]
              properties:
                supplierId: { type: string, format: uuid }
                lines:
                  type: array
                  items:
                    type: object
                    required: [variantId, unitCost]
                    properties:
                      variantId: { type: string, format: uuid }
                      quantity: { type: string }
                      unitCost: { type: string }
                      taxRate: { type: string }
      responses:
        '200': { description: '`order` e `idempotent` (201 se criou a encomenda).' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /purchase-orders:
    get:
      summary: Encomendas a fornecedor (purchase.read; funcionalidade procurement.orders)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: supplierId, in: query, required: false, schema: { type: string, format: uuid } }
        - {
            name: status,
            in: query,
            required: false,
            schema: { type: string, enum: [DRAFT, ORDERED, PARTIAL, RECEIVED, CANCELLED] },
          }
        - { name: q, in: query, required: false, schema: { type: string } }
        - {
            name: limit,
            in: query,
            required: false,
            schema: { type: integer, minimum: 1, maximum: 200 },
          }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0 } }
      responses:
        '200': { description: 'Encomendas; `meta.total` conta as que correspondem aos filtros.' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    post:
      summary: Cria uma encomenda a fornecedor em rascunho (purchase.manage)
      description: |
        A moeda é a do fornecedor. Um fornecedor bloqueado ou inactivo não recebe novas encomendas (409 `SUPPLIER_BLOCKED`, `SUPPLIER_INACTIVE`). Líquido = quantidade × custo e imposto = líquido × taxa, em aritmética exacta.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supplierId]
              properties:
                supplierId: { type: string, format: uuid }
                organizationId: { type: string, format: uuid }
                orderDate: { type: string, format: date }
                notes: { type: string, nullable: true }
                lines:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [variantId, quantity, unitCost]
                    properties:
                      variantId: { type: string, format: uuid }
                      quantity: { type: string }
                      unitCost: { type: string }
                      taxRate: { type: string }
      responses:
        '201': { description: 'Encomenda com as linhas e totais.' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /purchase-orders/{id}:
    get:
      summary: Uma encomenda com as linhas e o recebido por linha (purchase.read)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          {
            description: 'Encomenda; cada linha traz `receivedQty` (recepções lançadas e não revertidas).',
          }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      summary: Altera o cabeçalho de uma encomenda em rascunho (purchase.manage)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer, minimum: 1 }
                orderDate: { type: string, format: date }
                notes: { type: string, nullable: true }
      responses:
        '200': { description: 'Encomenda.' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      summary: Apaga uma encomenda em rascunho (purchase.manage)
      description: |
        Só um rascunho se apaga (409 `PURCHASE_ORDER_NOT_DRAFT`); uma criada de uma requisição também não (409 `PURCHASE_ORDER_FROM_REQUISITION`).
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: 'Apagada.' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /purchase-orders/{id}/lines:
