                organizationId: { type: string, format: uuid }
                customerId: { type: string, format: uuid }
                contractId: { type: string, format: uuid, nullable: true }
                dueOn: { type: string, format: date }
                notes: { type: string, maxLength: 1000, nullable: true }
                lines:
                  type: array
                  maxItems: 100
                  items:
