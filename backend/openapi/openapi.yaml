  /quotes/{id}/lines:
    post:
      summary: Acrescenta uma linha a uma proposta em rascunho (quote.manage)
      description: |
        O preço, o escalão, o desconto máximo e a origem vêm da resolução do catálogo e o imposto da taxa válida na data para a
        categoria do produto: nada disto vem do cliente. Os valores calculam-se com aritmética exacta (arredondamento da
        configuração `tax.roundingMode`) e ficam em instantâneo na linha. Devolve a proposta com as linhas e os totais.
