  /prices/resolve:
    get:
      summary: Resolve o preço de uma variante para uma organização, moeda, quantidade e data (price.read)
      description: |
        Em cada tabela aplicável (organização, moeda e período) vale o escalão mais alto cuja quantidade mínima é atingida;
        entre tabelas vence a de maior prioridade. Devolve o preço, o desconto máximo e a origem (tabela e item) para o
        documento a congelar. 404 `PRICE_NOT_FOUND`; 409 `PRICE_AMBIGUOUS` (empate de prioridade) ou `VARIANT_INACTIVE`.
      security: [{ sessionCookie: [] }]
      parameters:
