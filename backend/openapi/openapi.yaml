        tarefa de grupo que um titular reclama), `criteria` (`ALL`, `ANY` ou `QUORUM` com `quorum`), `condition?` (AST das políticas
        de acesso sobre `resource.<campo não sensível>`; dispensa a etapa quando é falsa), `dueInHours?` e `allowSelfApproval?`
        (por omissão `false`). `graph.amountField?` (campo decimal) e `graph.currencyField?` dão o montante que limita as
        delegações e aparece na caixa de aprovações. Publicar exige responsáveis resolvíveis (membro activo, ou papel com pelo menos
