openapi: 3.0.3
info:
  title: Sistema de Gestão — API
  version: 0.2.0
  description: |
    Contrato da API `/api/v1` mantido à mão e verificado contra as rotas registadas
    (`tests/functional/openapi_parity.spec.ts`). Autenticação por cookie de sessão opaco
    (HttpOnly, SameSite=Lax) + cabeçalho `X-Csrf-Token` nas escritas autenticadas.
servers:
  - url: /api/v1
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sg_session
  headers:
    CorrelationId:
      description: Identificador do pedido (também no corpo).
      schema: { type: string }
  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      description: Selector do tenant (ou X-Tenant-Code); validado contra a membership activa.
      schema: { type: string, format: uuid }
    CsrfToken:
      name: X-Csrf-Token
      in: header
      required: true
      description: Token anti-CSRF obtido no login ou em `GET /me`.
      schema: { type: string }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details, correlationId]
          properties:
            code: { type: string }
            message: { type: string }
            correlationId: { type: string }
            details:
              type: array
              items:
                type: object
                required: [path, code, message]
                properties:
                  path: { type: string }
                  code: { type: string }
                  message: { type: string }
    User:
      type: object
      required: [id, email, displayName, locale]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        displayName: { type: string }
        locale: { type: string, nullable: true }
  responses:
    Error:
      description: Erro no formato comum.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
paths:
  /health:
    get:
      summary: Liveness
      responses:
        '200': { description: O processo responde. }
  /ready:
    get:
      summary: Readiness (base de dados e Redis)
      responses:
        '200': { description: Pronto. }
        '503': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      summary: Inicia sessão (define o cookie de sessão)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200': { description: Sessão criada; devolve o utilizador e o token CSRF. }
        '401': { description: INVALID_CREDENTIALS (indistinguível entre causas). }
        '403': { description: ORIGIN_NOT_ALLOWED. }
        '422': { $ref: '#/components/responses/Error' }
        '429': { description: RATE_LIMITED, com `Retry-After`. }
  /auth/forgot-password:
    post:
      summary: Pede a recuperação de palavra-passe (resposta sempre igual)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        '202': { description: Aceite, exista ou não a conta. }
        '422': { $ref: '#/components/responses/Error' }
        '429': { description: RATE_LIMITED. }
  /auth/reset-password:
    post:
      summary: Conclui a recuperação com o token de uso único
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string }
      responses:
        '204': { description: Palavra-passe alterada; todas as sessões revogadas. }
        '400': { description: INVALID_OR_EXPIRED_TOKEN. }
        '422': { $ref: '#/components/responses/Error' }
  /auth/verify-email:
    post:
      summary: Verifica o email com o token de uso único
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '204': { description: Email verificado. }
        '400': { description: INVALID_OR_EXPIRED_TOKEN. }
  /auth/logout:
    post:
      summary: Termina a sessão actual
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '204': { description: Sessão revogada. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { description: CSRF_TOKEN_INVALID. }
  /me:
    get:
      summary: Utilizador autenticado
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Utilizador, token CSRF e sessão. }
        '401': { $ref: '#/components/responses/Error' }
  /me/sessions:
    get:
      summary: Sessões activas do utilizador
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Lista de sessões (a actual marcada). }
        '401': { $ref: '#/components/responses/Error' }
  /me/sessions/{id}:
    delete:
      summary: Revoga uma sessão própria
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Revogada. }
        '404': { description: Inexistente ou de outro utilizador. }
  /me/tenants:
    get:
      summary: Tenants a que o utilizador pertence (membership activa)
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Lista com id, código, nome e estado do tenant. }
        '401': { $ref: '#/components/responses/Error' }
  /context:
    get:
      summary: Contexto do tenant seleccionado
      description: |
        O tenant é indicado por `X-Tenant-Id` ou `X-Tenant-Code` (ou por um domínio verificado no `Host`).
        É apenas um selector: o servidor valida a membership activa e o estado do tenant.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: X-Tenant-Id, in: header, required: false, schema: { type: string, format: uuid } }
        - { name: X-Tenant-Code, in: header, required: false, schema: { type: string } }
      responses:
        '200':
          {
            description: Tenant,
            membership,
            utilizador,
            locale,
            authorizationVersion e âmbito de unidades.,
          }
        '400': { description: TENANT_SELECTOR_REQUIRED / INVALID / AMBIGUOUS / MISMATCH. }
        '401': { $ref: '#/components/responses/Error' }
        '403':
          {
            description: TENANT_ACCESS_DENIED (sem membership ou tenant inexistente) ou TENANT_NOT_ACTIVE.,
          }
  /me/password:
    post:
      summary: Altera a palavra-passe (exige a actual; revoga as outras sessões)
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string }
      responses:
        '204': { description: Alterada. }
        '403': { description: REAUTHENTICATION_FAILED. }
        '422': { $ref: '#/components/responses/Error' }
        '429': { description: RATE_LIMITED. }
  /permissions:
    get:
      summary: Catálogo de permissões (iam.read)
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      responses:
        '200': { description: Permissões `<recurso>.<acção>`. }
        '403': { description: PERMISSION_DENIED. }
  /roles:
    get:
      summary: Papéis do tenant (iam.read)
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      responses:
        '200': { description: Papéis com os códigos das suas permissões. }
        '403': { description: PERMISSION_DENIED. }
    post:
      summary: Cria um papel (iam.manage)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, permissionCodes]
              properties:
                code: { type: string }
                name: { type: string }
                description: { type: string, nullable: true }
                permissionCodes: { type: array, items: { type: string } }
      responses:
        '201': { description: Criado (cabeçalho Location). }
        '409': { description: ROLE_CODE_TAKEN. }
        '422': { $ref: '#/components/responses/Error' }
  /roles/{id}:
    get:
      summary: Detalhe de um papel (iam.read)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Papel. }
        '404': { description: Inexistente ou de outro tenant. }
    patch:
      summary: Altera um papel com expectedVersion (iam.manage)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer }
                name: { type: string }
                description: { type: string, nullable: true }
                permissionCodes: { type: array, items: { type: string } }
      responses:
        '200': { description: Actualizado; invalida a authorizationVersion de quem tem o papel. }
        '409': { description: VERSION_CONFLICT ou SYSTEM_ROLE_IMMUTABLE. }
        '404': { description: Inexistente ou de outro tenant. }
    delete:
      summary: Remove um papel (iam.manage)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Removido. }
        '409': { description: ROLE_IN_USE ou SYSTEM_ROLE_IMMUTABLE. }
  /role-assignments:
    get:
      summary: Atribuições de papéis (iam.read)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: membershipId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Atribuições. }
    post:
      summary: Atribui um papel a uma membership (iam.manage)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [membershipId, roleId]
              properties:
                membershipId: { type: string, format: uuid }
                roleId: { type: string, format: uuid }
                organizationUnitId: { type: string, format: uuid, nullable: true }
                validFrom: { type: string, format: date-time, nullable: true }
                validUntil: { type: string, format: date-time, nullable: true }
      responses:
        '201': { description: Criada. }
        '404': { description: Membership ou papel inexistentes neste tenant. }
        '409': { description: ASSIGNMENT_EXISTS. }
        '422': { $ref: '#/components/responses/Error' }
  /role-assignments/{id}:
    delete:
      summary: Revoga uma atribuição (iam.manage)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Revogada. }
        '404': { description: Inexistente ou de outro tenant. }
  /access-policies:
    get:
      summary: Políticas ABAC (iam.read)
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      responses:
        '200': { description: Políticas. }
    post:
      summary: Cria uma política (iam.manage)
      description: |
        `condition` é uma AST declarativa (and/or/not/eq/neq/gt/gte/lt/lte/in/exists) com variáveis
        `subject.*`, `resource.*` e `env.*`. Nunca se executa código do tenant. Qualquer DENY activo
        aplicável prevalece; havendo políticas ALLOW aplicáveis, pelo menos uma tem de se verificar.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, resource, action, effect]
              properties:
                name: { type: string }
                resource: { type: string, description: 'Ou * para qualquer.' }
                action: { type: string, description: 'Ou * para qualquer.' }
                effect: { type: string, enum: [ALLOW, DENY] }
                condition: { type: object, nullable: true }
                priority: { type: integer }
                status: { type: string, enum: [DRAFT, ACTIVE, DISABLED] }
                fieldRules:
                  type: array
                  items:
                    type: object
                    required: [field, mode]
                    properties:
                      field: { type: string }
                      mode: { type: string, enum: [HIDDEN, READ_ONLY] }
                      when: { type: object }
      responses:
        '201': { description: Criada (estado DRAFT por omissão). }
        '422': { description: AST ou regras inválidas, com o caminho do problema. }
  /access-policies/{id}:
    patch:
      summary: Altera uma política com expectedVersion (iam.manage)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer }
      responses:
        '200':
          { description: Actualizada; invalida a authorizationVersion de todas as memberships. }
        '404': { description: Inexistente ou de outro tenant. }
        '409': { description: VERSION_CONFLICT. }
  /authorization/simulate:
    post:
      summary: Simula uma decisão (iam.manage); não concede nem altera nada
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [membershipId, permission]
              properties:
                membershipId: { type: string, format: uuid }
                permission: { type: string }
                resource: { type: object }
      responses:
        '200': { description: Decisão, origem (papéis e políticas) e campos ocultos/só de leitura. }
        '404': { description: Membership inexistente neste tenant. }
  /organizations:
    get:
      summary: Organizações (organization.read)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200': { description: OK. }
    post:
      summary: Cria uma organização (organization.manage)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, legalName, countryCode, baseCurrency]
              properties:
                code: { type: string }
                legalName: { type: string }
                tradeName: { type: string, nullable: true }
                countryCode: { type: string, description: ISO 3166-1 alfa-2 }
                taxId: { type: string, nullable: true }
                baseCurrency: { type: string, description: ISO 4217 }
                fiscalYearStartMonth: { type: integer, minimum: 1, maximum: 12 }
      responses:
        '201': { description: Criado (cabeçalho Location). }
        '409': { description: Código duplicado. }
        '422': { $ref: '#/components/responses/Error' }
  /organizations/{id}:
    get:
      summary: Detalhe de uma organização
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK. }
        '404': { description: Inexistente ou de outro tenant. }
    patch:
      summary: Altera uma organização com expectedVersion (organization.manage; o código não muda)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer }
                code: { type: string }
                legalName: { type: string }
                tradeName: { type: string, nullable: true }
                countryCode: { type: string, description: ISO 3166-1 alfa-2 }
                taxId: { type: string, nullable: true }
                baseCurrency: { type: string, description: ISO 4217 }
                fiscalYearStartMonth: { type: integer, minimum: 1, maximum: 12 }
      responses:
        '200': { description: Actualizado. }
        '404': { description: Inexistente ou de outro tenant. }
        '409': { description: VERSION_CONFLICT. }
        '422': { $ref: '#/components/responses/Error' }
  /organization-units:
    get:
      summary: Unidades organizacionais (filtro organizationId)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - {
            name: organizationId,
            in: query,
            required: false,
            schema: { type: string, format: uuid },
          }
      responses:
        '200': { description: OK. }
    post:
      summary: Cria uma unidade (a unidade pai tem de ser da mesma organização)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId, code, name]
              properties:
                organizationId: { type: string, format: uuid }
                parentId: { type: string, format: uuid, nullable: true }
                code: { type: string }
                name: { type: string }
                type: { type: string, enum: [BRANCH, DEPARTMENT, SECTION, TEAM, OTHER] }
                managerMembershipId: { type: string, format: uuid, nullable: true }
                timezone: { type: string, nullable: true }
      responses:
        '201': { description: Criado (cabeçalho Location). }
        '409': { description: Código duplicado. }
        '422': { $ref: '#/components/responses/Error' }
  /organization-units/{id}:
    get:
      summary: Detalhe de uma unidade
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK. }
        '404': { description: Inexistente ou de outro tenant. }
    patch:
      summary: Altera uma unidade; rejeita ciclos (a organização e o código não mudam)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer }
                parentId: { type: string, format: uuid, nullable: true }
                name: { type: string }
                type: { type: string, enum: [BRANCH, DEPARTMENT, SECTION, TEAM, OTHER] }
                managerMembershipId: { type: string, format: uuid, nullable: true }
                timezone: { type: string, nullable: true }
                active: { type: boolean }
      responses:
        '200': { description: Actualizado. }
        '404': { description: Inexistente ou de outro tenant. }
        '409': { description: VERSION_CONFLICT. }
        '422': { $ref: '#/components/responses/Error' }
  /organization-units/{id}/members:
    get:
      summary: Membros da equipa de uma unidade
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK. }
        '404': { description: Unidade inexistente. }
    post:
      summary: Acrescenta um membro à equipa (unidade activa)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [membershipId, startsOn]
              properties:
                membershipId: { type: string, format: uuid }
                startsOn: { type: string, format: date }
                endsOn: { type: string, format: date, nullable: true }
                roleLabel: { type: string, nullable: true }
      responses:
        '201': { description: Criado. }
        '404': { description: Unidade ou membership inexistentes. }
        '409': { description: UNIT_INACTIVE. }
        '422': { $ref: '#/components/responses/Error' }
  /team-members/{id}:
    delete:
      summary: Remove um membro de equipa
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Removido. }
        '404': { description: Inexistente ou de outro tenant. }
  /cost-centers:
    get:
      summary: Centros de custo (filtro organizationId)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - {
            name: organizationId,
            in: query,
            required: false,
            schema: { type: string, format: uuid },
          }
      responses:
        '200': { description: OK. }
    post:
      summary: Cria um centro de custo (o pai tem de ser da mesma organização)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId, code, name]
              properties:
                organizationId: { type: string, format: uuid }
                parentId: { type: string, format: uuid, nullable: true }
                code: { type: string }
                name: { type: string }
                responsibleMembershipId: { type: string, format: uuid, nullable: true }
      responses:
        '201': { description: Criado (cabeçalho Location). }
        '409': { description: Código duplicado. }
        '422': { $ref: '#/components/responses/Error' }
  /cost-centers/{id}:
    patch:
      summary: Altera um centro de custo; rejeita ciclos
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer }
                parentId: { type: string, format: uuid, nullable: true }
                name: { type: string }
                responsibleMembershipId: { type: string, format: uuid, nullable: true }
                active: { type: boolean }
      responses:
        '200': { description: Actualizado. }
        '404': { description: Inexistente ou de outro tenant. }
        '409': { description: VERSION_CONFLICT. }
        '422': { $ref: '#/components/responses/Error' }
  /membership-scopes:
    get:
      summary: Âmbitos de acesso (iam.read; filtro membershipId)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: membershipId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200': { description: OK. }
    post:
      summary: Atribui um âmbito (organização inteira ou unidade ± descendentes) (iam.manage)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [membershipId, organizationId]
              properties:
                membershipId: { type: string, format: uuid }
                organizationId: { type: string, format: uuid }
                organizationUnitId: { type: string, format: uuid, nullable: true }
                includeDescendants: { type: boolean }
      responses:
        '201': { description: Criado; invalida a authorizationVersion da membership. }
        '404': { description: Membership ou organização inexistentes. }
        '409': { description: SCOPE_EXISTS. }
        '422': { description: A unidade não pertence à organização. }
  /membership-scopes/{id}:
    delete:
      summary: Remove um âmbito (iam.manage)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Removido. }
        '404': { description: Inexistente ou de outro tenant. }
  /memberships:
    get:
      summary: Membros do tenant com utilizador e papéis (member.read)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200': { description: Lista. }
        '403': { description: PERMISSION_DENIED. }
  /memberships/{id}:
    get:
      summary: Detalhe de um membro (member.read)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Membro. }
        '404': { description: Inexistente ou de outro tenant. }
    patch:
      summary: Suspende, reactiva ou termina um membro (member.manage)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, expectedVersion]
              properties:
                status: { type: string, enum: [ACTIVE, SUSPENDED, LEFT] }
                expectedVersion: { type: integer }
      responses:
        '200': { description: Actualizado; incrementa a authorizationVersion. }
        '404': { description: Inexistente ou de outro tenant. }
        '409':
          {
            description: VERSION_CONFLICT,
            INVALID_STATE_TRANSITION ou LAST_ADMIN (o tenant ficaria sem administrador activo).,
          }
  /invitations:
    get:
      summary: Convites com estado efectivo (member.read)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200': { description: Lista (EXPIRED é derivado do prazo). }
    post:
      summary: Convida um email (member.invite); o token vai só por email
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
                roleIds: { type: array, items: { type: string, format: uuid } }
                unitIds: { type: array, items: { type: string, format: uuid } }
                expiresInDays: { type: integer, minimum: 1, maximum: 30 }
      responses:
        '201': { description: Criado (cabeçalho Location); sem token na resposta. }
        '409': { description: ALREADY_MEMBER ou INVITATION_PENDING. }
        '422': { description: Email, prazo, papéis ou unidades inválidos. }
  /invitations/{id}/revoke:
    post:
      summary: Revoga um convite pendente (member.invite)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Revogado. }
        '404': { description: Inexistente ou de outro tenant. }
        '409': { description: Já não está pendente. }
  /invitations/accept:
    post:
      summary: Aceita um convite (sessão do convidado; o tenant vem do token)
      description: |
        O email da conta tem de ser o do convite. Token de uso único, quota de membros e estado do tenant são
        verificados numa só transacção. Qualquer falha de token/email/estado responde igual (400).
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200': { description: Membership criada/reactivada (tenantId, membershipId). }
        '400': { description: INVALID_OR_EXPIRED_TOKEN. }
        '409': { description: ALREADY_MEMBER ou MEMBER_QUOTA_EXCEEDED. }
  /me/preferences:
    get:
      summary: Preferências do próprio membro
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200': { description: Mapa chave → valor. }
  /me/preferences/{key}:
    put:
      summary: Define uma preferência (lista fechada de chaves)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - {
            name: key,
            in: path,
            required: true,
            schema: { type: string },
            description: 'Ex.: ui.theme, ui.timezone, notifications.email.',
          }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value: {}
      responses:
        '200': { description: Preferências actuais. }
        '422': { description: UNKNOWN_PREFERENCE ou INVALID_VALUE. }
    delete:
      summary: Remove uma preferência
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - {
            name: key,
            in: path,
            required: true,
            schema: { type: string },
            description: 'Ex.: ui.theme, ui.timezone, notifications.email.',
          }
      responses:
        '204': { description: Removida. }
        '404': { description: Não definida. }
  /me/default-organization:
    put:
      summary: Define a organização por omissão do próprio membro
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organizationId]
              properties:
                organizationId: { type: string, format: uuid, nullable: true }
      responses:
        '200': { description: Membro actualizado. }
        '422': { description: Organização inexistente neste tenant. }
