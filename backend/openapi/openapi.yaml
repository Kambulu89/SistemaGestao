        (`eq/neq/gt/gte/lt/lte`, `in/nin`, `empty/notEmpty`, `and/or/not`) sobre campos activos e não sensíveis. O rascunho só
        precisa de estar bem formado; a publicação verifica-o contra a entidade. A entidade tem de estar publicada.
