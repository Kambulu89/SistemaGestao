    post:
      summary: Cria uma factura em rascunho (invoice.manage)
      description: |
        Com `orderId` factura-se uma encomenda confirmada: sem `lines` entram todas as linhas com quantidade por facturar; cada linha leva `orderLineId` e, opcionalmente, `quantity` (por omissão, o que falta). O facturável é o **expedido** nos bens com controlo de stock e o **encomendado** nos serviços, menos o já facturado (422 `EXCEEDS_BILLABLE`; 409 `ORDER_NOT_BILLABLE`, `NOTHING_TO_INVOICE`).
        Sem encomenda, indique `customerId` e `organizationId` e linhas livres (descrição, quantidade, preço sem imposto, taxa; uma taxa zero exige `exemptionReason`). O vencimento por omissão é a data + o prazo do cliente.
