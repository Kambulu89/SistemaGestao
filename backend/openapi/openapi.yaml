    delete:
      summary: Remove uma linha de uma recepção em rascunho (receipt.manage)
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CsrfToken'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: lineId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 'Recepção.' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /goods-receipts/{id}/post:
    post:
      summary: Lança a recepção (receipt.post)
      description: |
        Confere o saldo de cada linha sob bloqueio da encomenda (409 `GOODS_RECEIPT_NOT_POSTABLE`), atribui o número (sequência GOODS_RECEIPT), **dá entrada do stock na mesma transacção** ao custo da linha da encomenda (no primeiro local activo do armazém, criando o lote nos produtos por lote) e passa a encomenda a `PARTIAL` ou `RECEIVED`. Idempotente.
      security: [{ sessionCookie: [] }]
      parameters:
