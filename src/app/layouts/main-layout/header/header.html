<header
  class="sticky top-0 z-30 flex h-16 items-center gap-3 border-b border-line bg-surface px-4 sm:px-6"
>
  <app-button
    class="lg:hidden"
    variant="ghost"
    label="Abrir menu de navegação"
    aria-controls="sidebar"
    [attr.aria-expanded]="sidebarOpen()"
    (click)="menuToggle.emit()"
  >
    <app-icon name="menu" class="size-5" />
  </app-button>

  <span class="text-base font-semibold tracking-tight">Sistema de Gestão</span>

  <div class="ms-auto">
    <app-button
      variant="ghost"
      [label]="'Tema: ' + themeUi().label + '. Clique para alterar.'"
      (click)="cycleTheme()"
    >
      <app-icon [name]="themeUi().icon" class="size-5" />
    </app-button>
  </div>
</header>
