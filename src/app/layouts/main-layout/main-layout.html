<a
  href="#conteudo"
  class="sr-only focus:not-sr-only focus:fixed focus:start-4 focus:top-4 focus:z-[60] focus:rounded-lg focus:bg-brand-600 focus:px-4 focus:py-2 focus:text-white"
>
  Saltar para o conteúdo
</a>

<div class="flex min-h-dvh">
  <app-sidebar [items]="navItems" [open]="sidebarOpen()" (closed)="closeSidebar()" />

  @if (sidebarOpen()) {
    <div
      class="fixed inset-0 z-40 bg-slate-900/50 lg:hidden"
      aria-hidden="true"
      (click)="closeSidebar()"
    ></div>
  }

  <div class="flex min-w-0 flex-1 flex-col">
    <app-header [sidebarOpen]="sidebarOpen()" (menuToggle)="toggleSidebar()" />

    <main id="conteudo" tabindex="-1" class="flex-1 p-4 sm:p-6 lg:p-8">
      <router-outlet />
    </main>
  </div>
</div>
