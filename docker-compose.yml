# Só para desenvolvimento local: PostgreSQL 16. A API e o frontend correm com `npm run dev` / `npm start`.
# As credenciais vêm de um `.env` na raiz (ver `.env.compose.example`); nunca as escreva aqui.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      POSTGRES_DB: ${DB_DATABASE:-app}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-app}']
      interval: 5s
      retries: 20

volumes:
  pgdata:
