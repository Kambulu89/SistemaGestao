# Ambiente de desenvolvimento. NÃO é uma configuração de produção.
#   cp .env.compose.example .env && docker compose up --build
# Serviços: PostgreSQL 16, Redis 7, armazenamento S3 local (MinIO), API e frontend.
# O worker de filas ainda não existe (não há jobs até à Fase 2); será acrescentado com o primeiro job real.
name: sistema-gestao

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?defina POSTGRES_ADMIN_PASSWORD no .env}
      SG_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?defina DB_OWNER_PASSWORD no .env}
      SG_RUNTIME_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?defina S3_ACCESS_KEY no .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?defina S3_SECRET_KEY no .env}
    volumes:
      - miniodata:/data
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'

  api:
    build:
      context: ./backend
      target: dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3333
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_KEY: ${APP_KEY:?defina APP_KEY no .env}
      CORS_ORIGINS: http://localhost:4200
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: sistema_gestao
      DB_USER: sg_runtime
      DB_PASSWORD: ${DB_PASSWORD}
      DB_OWNER_USER: sg_owner
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./backend:/app
      - api_node_modules:/app/node_modules
    ports:
      - '127.0.0.1:3333:3333'
    # As migrations correm explicitamente: docker compose exec api npm run migrate

  web:
    build:
      context: .
      dockerfile: Dockerfile.web.dev
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    ports:
      - '127.0.0.1:4200:4200'

volumes:
  pgdata:
  miniodata:
  api_node_modules:
