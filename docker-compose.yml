# Só para desenvolvimento local: PostgreSQL 16. A API e o frontend correm com `npm run dev` / `npm start`.
# Credenciais num `.env` na raiz (ver `.env.compose.example`); nunca as escreva aqui.
# Na primeira arranque, cria as contas `app_owner` (migrações) e `app` (runtime, sem BYPASSRLS) e as bases app e app_test.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?defina DB_OWNER_PASSWORD no .env}
      DATABASES: app app_test
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/create-roles.sh:/docker-entrypoint-initdb.d/10-create-roles.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 20

volumes:
  pgdata:
