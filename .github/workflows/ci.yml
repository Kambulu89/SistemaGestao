name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-superuser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TZ: UTC
      PORT: 3333
      HOST: localhost
      LOG_LEVEL: warn
      NODE_ENV: test
      APP_KEY: ci-only-app-key-not-a-secret-000000
      APP_URL: http://localhost:3333
      SESSION_DRIVER: memory
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: app
      DB_PASSWORD: ci-only-password
      DB_OWNER_USER: app_owner
      DB_OWNER_PASSWORD: ci-only-owner-password
      DB_DATABASE: app_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Contas PostgreSQL (owner + runtime sem BYPASSRLS)
        run: ../docker/postgres/create-roles.sh
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: ci-only-superuser
          DATABASES: app_test
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
